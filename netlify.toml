# Netlify config. This is a static, client-side-only site — no build step.
# The repo root is served directly; index.html is the entry point.
[build]
  publish = "."
  command = ""

# Filenames are NOT fingerprinted (no build step), so we must revalidate every
# asset on each load — otherwise a stale cached app.js renders the new HTML's
# empty controls and new deploys stay invisible for up to a day. ETag makes
# revalidation cheap (304 when unchanged) while picking up deploys immediately.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/domains/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
